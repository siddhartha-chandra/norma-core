[project]
name = "desk-core"
version = "0.1.0"
description = "DESK-CORE — Tripartite Embodied Desk Concierge for NormaCore Station"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mujoco>=3.0",
    "opencv-python>=4.10,<5.1",
    "google-genai>=1.0",
    "fastmcp>=2.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyttsx3>=2.90",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "textual>=8.2.8",
    "pytracik>=0.0.4",
    "pin>=3.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
