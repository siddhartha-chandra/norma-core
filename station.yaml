drivers:
  st3215:
    enabled: true
    current-threshold: 200    # Raised from 100 to prevent premature shoulder (j2) stall trips
    deadband: 20
  system-info: true
  usb-video:
    enabled: true
    resize_target: 0          # Keep the camera capture resolution
    formats:
      - {format: "1280x720@30fps,mjpeg"}
    frame-skip: 0

inference:
  - queue-id: inference/normvla
    shm: /tmp/normvla         # macOS-safe path (/dev/shm is Linux-only)
    shm-size-mb: 12
    format: normvla
    # Follower 5B8E115307 (12 V). Leader 5B61034956 (7.4 V) has no config key;
    # mirroring is set at runtime in the web UI (follower card, source = leader).
    st3215-bus: 5B8E115307
    update-interval: 100ms
