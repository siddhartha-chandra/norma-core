drivers:
  st3215:
    enabled: true
    current-threshold: 200    # Raised from 100 to prevent premature shoulder (j2) stall trips
    deadband: 20
  system-info: true
  usb-video:
    enabled: true
    resize_target: 0          # Keep the camera capture resolution
    formats:
      - {format: "1920x1080@30fps,mjpeg"}
      - {format: "1280x720@30fps,mjpeg"}
      - {format: "640x480@30fps,mjpeg"}
    frame-skip: 0

inference:
  - queue-id: inference/normvla
    shm: /tmp/normvla         # macOS-safe path (/dev/shm is Linux-only)
    shm-size-mb: 12
    format: normvla
    st3215-bus: auto          # IMPORTANT: Replace "auto" with FOLLOWER bus serial if leader+follower are both plugged in!
    update-interval: 100ms
